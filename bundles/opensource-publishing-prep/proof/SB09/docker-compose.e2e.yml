name: candoitall-ipfs-sb09-e2e

services:
  ipfs-a:
    build:
      context: ../../../..
      dockerfile: docker/Dockerfile.ipfs-node
    image: candoitall-ipfs-node:sb09-e2e
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      IPFS_NODE_API_URL: http://0.0.0.0:5001
      IPFS_PATH: /data/ipfs
      IPFS_PASS: ${IPFS_PASS:?Set IPFS_PASS before running docker compose.}
      IpfsHttpHost__Mode: Light
      IpfsHttpHost__RequireAuthentication: "false"
      IpfsHttpHost__AllowAnyOrigin: "true"
    ports:
      - "5101:5001"
    volumes:
      - ipfs-a-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://127.0.0.1:5001/api/v0/id >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  ipfs-b:
    build:
      context: ../../../..
      dockerfile: docker/Dockerfile.ipfs-node
    image: candoitall-ipfs-node:sb09-e2e
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      IPFS_NODE_API_URL: http://0.0.0.0:5001
      IPFS_PATH: /data/ipfs
      IPFS_PASS: ${IPFS_PASS:?Set IPFS_PASS before running docker compose.}
      IpfsHttpHost__Mode: Light
      IpfsHttpHost__RequireAuthentication: "false"
      IpfsHttpHost__AllowAnyOrigin: "true"
    ports:
      - "5102:5001"
    volumes:
      - ipfs-b-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://127.0.0.1:5001/api/v0/id >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

volumes:
  ipfs-a-data:
  ipfs-b-data:
